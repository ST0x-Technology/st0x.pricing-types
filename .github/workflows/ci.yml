name: CI
on:
  push:
    branches: [master, main]
  pull_request:

# Pure-Rust crate with no submodules / Foundry — delegate to rainix's
# reusable workflows for the standard rust-shell fmt/clippy/test. The
# workflows themselves pin `nix develop github:rainlanguage/rainix#rust-shell`
# + the cache setup so we don't reimplement either here.
jobs:
  test:
    uses: rainlanguage/rainix/.github/workflows/rainix-rs-test.yaml@master
  static:
    uses: rainlanguage/rainix/.github/workflows/rainix-rs-static.yaml@master
